{% extends 'bailti/base.html' %}

   {% block content %}

   <div class="container mx-auto px-4">
      <div class="flex items-center py-5 border-blue-100 border-b-1 shadow-xs bg-white p-5 rounded-lg my-4">
         <div class="mes-proprietes ">
            <h2 class="text-5xl font-bold my-4">Mes Proprietés</h2>
            <p class="text-xl">Gérer vos bien immobilier</p>
         </div>
      </div>
      <div class="form-create border-blue-100 border-b-1 shadow-xs bg-white p-5 rounded-lg my-8">


      <form class="mx-auto" 
            action="{% if property %}{% url 'property_update' property.id %}{% else %}{% url 'property_store' %}{% endif %}" 
            method="POST" enctype="multipart/form-data">
         {% csrf_token %}

         <!-- Identifiant -->
         <div class="mb-5">
            <label for="identifiant" class="block mb-2 text-md font-medium">Identifiant *</label>
            <input
                  type="text"
                  name="identifiant"
                  id="identifiant"
                  value="{% if property %}{{ property.identifiant }}{% endif %}"
                  class="shadow-xs bg-gray-50 h-13 border border-gray-300 text-gray-900 text-sm rounded-lg 
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                  placeholder="bien_identifiant"
                  required
            >
         </div>

         <!-- Type -->
         <div class="mb-5">
            <label for="type" class="block mb-2 text-md font-medium">Type *</label>
            <select name="type" id="type"
                  class="shadow-xs bg-gray-50 h-13 border border-gray-300 text-gray-900 text-sm rounded-lg 
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">

                  <option value="maison" {% if property and property.type == 'maison' %}selected{% endif %}>Maison</option>
                  <option value="appartement" {% if property and property.type == 'appartement' %}selected{% endif %}>Appartement</option>
                  <option value="studio" {% if property and property.type == 'studio' %}selected{% endif %}>Studio</option>
                  <option value="villa" {% if property and property.type == 'villa' %}selected{% endif %}>Villa</option>
            </select>
         </div>

         <!-- Adresse -->
         <div class="mb-5">
            <label for="adresse" class="block mb-2 text-md font-medium">Adresse *</label>
            <input
                  type="text"
                  id="adresse"
                  name="adresse"
                  value="{% if property %}{{ property.adresse }}{% endif %}"
                  class="shadow-xs bg-gray-50 h-13 border border-gray-300 text-gray-900 text-sm rounded-lg 
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                  required
            >
         </div>

         <!-- Superficie -->
         <div class="mb-5">
            <label for="superficie" class="block mb-2 text-md font-medium">Superficie *</label>
            <input
                  type="number"
                  id="superficie"
                  name="superficie"
                  value="{% if property %}{{ property.superficie }}{% endif %}"
                  class="shadow-xs bg-gray-50 h-13 border border-gray-300 text-gray-900 text-sm rounded-lg 
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                  required
            >
         </div>

         <!-- Loyer -->
         <div class="mb-5">
            <label for="loyer" class="block mb-2 text-md font-medium">Loyer *</label>
            <input
                  type="number"
                  id="loyer"
                  name="loyer"
                  value="{% if property %}{{ property.loyer }}{% endif %}"
                  class="shadow-xs bg-gray-50 h-13 border border-gray-300 text-gray-900 text-sm rounded-lg 
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                  required
            >
         </div>

         <!-- Meublé -->
         <div class="mb-5">
            <label for="meuble" class="block mb-2 text-md font-medium">Meublé *</label>
            <input
                  type="checkbox"
                  name="meuble"
                  id="meuble"
                  class="w-8 shadow-xs bg-gray-50 h-13 border border-gray-300 text-gray-900 text-sm rounded-lg 
                        focus:ring-blue-500 focus:border-blue-500"
                  {% if property and property.meublé %}checked{% endif %}
            >
         </div>

         <!-- Description -->
         <div class="mb-5">
            <label for="description" class="block mb-2 text-sm font-medium">Description *</label>
            <textarea
                  id="description"
                  name="description"
                  class="shadow-xs bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
                        focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5"
                  required
            >{% if property %}{{ property.description }}{% endif %}</textarea>
         </div>

         <!-- Image -->
         <div class="mb-5">
            <label for="image" class="block mb-2 text-sm font-medium">Image *</label>
            <input
                  class="p-1 pt-3 block w-1/3 h-13 text-gray-900 border border-gray-300 rounded-lg cursor-pointer 
                        focus:outline-none text-md"
                  id="image"
                  type="file"
                  name="image"
            >
         </div>

         <!-- Submit -->
         <div class="flex justify-end">
            <button
                  type="submit"
                  class="text-white mt-6 bg-indigo-700 cursor-pointer hover:bg-indigo-800 focus:ring-4 focus:outline-none 
                        focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5">
                  Enregistrer
            </button>
         </div>
      </form>

      </div>



   </div>
    {% endblock %}
